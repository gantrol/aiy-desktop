appId: com.catai.aiy
productName: AIY Image Tools
directories:
  output: .tmp/electron-builder-store-payload
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!out/**/*.map'
  # Build-time only. Windows installs it for the Store MSIX workflow; other
  # platforms skip it through optionalDependencies.
  - '!node_modules/@microsoft/winappcli/**'
  - package.json
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  - '**/*.node'
npmRebuild: false
extraResources:
  - from: extensions
    to: extensions
  # Only lightweight, checked-in application content belongs here. Production
  # portrait libraries are imported explicitly and are not bundled.
  - from: content-packs
    to: content-packs
  - from: configuration
    to: configuration
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
win:
  executableName: aiy
  icon: build/icon.ico
  target:
    # electron-builder only prepares the x64 payload consumed by the Store
    # MSIX script. It is not a standalone distribution artifact.
    - target: dir
      arch: [x64]
