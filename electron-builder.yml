appId: com.catai.aiy
productName: AIY
protocols:
  - name: AIY
    schemes:
      - aiy
directories:
  output: .tmp/electron-builder-store-payload
extraMetadata:
  # The renderer and pure-JavaScript main dependencies are already bundled.
  # Keep the packaged manifest from declaring the development dependency graph.
  dependencies: null
  optionalDependencies: null
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!out/**/*.map'
  # electron-builder otherwise copies every production dependency even when its
  # code is already present in the Vite bundles.
  - '!node_modules/**'
  - package.json
  - LICENSE
  - LICENSE-PLUGIN-EXCEPTION
  # Explicit native runtime allowlist; model weights are selected separately.
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
    filter:
      - package.json
      - LICENSE
      - lib/**
      - prebuilds/win32-x64.node
  - from: node_modules/onnxruntime-node
    to: node_modules/onnxruntime-node
    filter:
      - package.json
      - dist/*.js
      - '!dist/binding.js'
  - from: .tmp/onnx-runtime-loader
    to: node_modules/onnxruntime-node/dist
    filter: [binding.js]
  - from: node_modules/onnxruntime-common
    to: node_modules/onnxruntime-common
    filter: [package.json, dist/cjs/*.js, dist/cjs/package.json]
  - from: node_modules/sharp
    to: node_modules/sharp
    filter: [package.json, dist/**, LICENSE]
  - from: node_modules/@img/sharp-win32-x64
    to: node_modules/@img/sharp-win32-x64
    filter: [package.json, lib/**, LICENSE]
  - from: node_modules/@img/colour
    to: node_modules/@img/colour
    filter: [package.json, '*.cjs', LICENSE.md]
  - from: node_modules/detect-libc
    to: node_modules/detect-libc
    filter: [package.json, lib/**, LICENSE]
  - from: node_modules/semver
    to: node_modules/semver
    filter: [package.json, '*.js', classes/**, functions/**, internal/**, ranges/**, LICENSE]
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  # Agents use Node.js to run the CLI and its shared chunks outside the Electron archive.
  - out/main/agent-cli.js
  - out/main/model-worker.js
  - out/main/image-search-process.js
  - out/main/image-search-worker.js
  - out/main/chunks/**
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
  - node_modules/onnxruntime-node/bin/**
  - node_modules/@img/sharp-*/lib/**
npmRebuild: false
beforePack: scripts/prepare-onnx-runtime-loader.cjs
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: LICENSE-PLUGIN-EXCEPTION
    to: LICENSE-PLUGIN-EXCEPTION
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: build/licenses/onnxruntime
    to: licenses/onnxruntime
  - from: node_modules/@huggingface/transformers/LICENSE
    to: licenses/transformers-js.LICENSE
  - from: extensions
    to: extensions
    filter:
      - '**/*'
      # Feature demo assets are imported by Vite and already included in app.asar.
      - '!com.aiy.feature-demo/assets/**'
  # Only lightweight, checked-in application content belongs here. Production
  # portrait libraries are imported explicitly and are not bundled.
  - from: content-packs
    to: content-packs
  - from: configuration
    to: configuration
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
win:
  executableName: aiy
  icon: build/icon.ico
  # Keep aligned with the Store payload policy and language-extension guide.
  # AIY message catalogs do not install Electron's native locale resources.
  electronLanguages:
    - en-US
    - zh-CN
  target:
    # electron-builder only prepares the x64 payload consumed by the Store
    # MSIX script. It is not a standalone distribution artifact.
    - target: dir
      arch: [x64]
