appId: com.catai.aiy
productName: AIY
protocols:
  - name: AIY
    schemes:
      - aiy
directories:
  output: .tmp/electron-builder-store-payload
extraMetadata:
  # The renderer and pure-JavaScript main dependencies are already bundled.
  # Keep the packaged manifest from declaring the development dependency graph.
  dependencies: null
  optionalDependencies: null
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!out/**/*.map'
  # electron-builder otherwise copies every production dependency even when its
  # code is already present in the Vite bundles.
  - '!node_modules/**'
  - package.json
  # better-sqlite3 is the only external main-process dependency. Package only
  # its JavaScript loader and the native binary for the Store target.
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
    filter:
      - package.json
      - LICENSE
      - lib/**
      - prebuilds/win32-x64.node
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
npmRebuild: false
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: extensions
    to: extensions
    filter:
      - '**/*'
      # Feature demo assets are imported by Vite and already included in app.asar.
      - '!com.aiy.feature-demo/assets/**'
  # Only lightweight, checked-in application content belongs here. Production
  # portrait libraries are imported explicitly and are not bundled.
  - from: content-packs
    to: content-packs
  - from: configuration
    to: configuration
  - from: build/icon.png
    to: icon.png
  - from: build/icon.ico
    to: icon.ico
win:
  executableName: aiy
  icon: build/icon.ico
  # Keep aligned with the Store payload policy and language-extension guide.
  # AIY message catalogs do not install Electron's native locale resources.
  electronLanguages:
    - en-US
    - zh-CN
  target:
    # electron-builder only prepares the x64 payload consumed by the Store
    # MSIX script. It is not a standalone distribution artifact.
    - target: dir
      arch: [x64]
