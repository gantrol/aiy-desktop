<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="24x24" href="./icon-24.png" />
    <title>AIY</title>
    <script data-app-loading-variant-bootstrap>
      {
        const appLoadingVariants = Array.from(crypto.getRandomValues(new Uint8Array(6)), (value) => value & 1).join('');
        document.documentElement.dataset.appLoadingVariants = appLoadingVariants;
        document.documentElement.dataset.appLoadingVariant = appLoadingVariants[0] === '1' ? 'ribbon' : 'portrait';
      }
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f8f7f3;
      }

      [data-initial-frame] {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        overflow: hidden;
        background: #f8f7f3;
      }

      [data-initial-frame] .app-loading-neutral-scene {
        position: relative;
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        overflow: hidden;
      }

      [data-initial-frame] .app-loading-neutral-aura {
        position: absolute;
        width: 12rem;
        height: 12rem;
        border-radius: 999px;
        background: #efe5e9;
        filter: blur(3rem);
        opacity: 0.34;
      }

      [data-initial-frame] .app-loading-neutral-icon {
        position: relative;
        display: block;
        width: 5rem;
        height: 5rem;
        object-fit: contain;
        animation: initial-frame-neutral-breathe 1.8s cubic-bezier(0.2, 0, 0, 1) infinite;
      }

      @keyframes initial-frame-neutral-breathe {
        0%,
        100% {
          opacity: 0.78;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        [data-initial-frame] .app-loading-neutral-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div data-initial-frame data-transition-owner="initial" data-preview-state="pending" aria-hidden="true">
        <span class="app-loading-neutral-scene">
          <span class="app-loading-neutral-aura"></span>
          <img class="app-loading-neutral-icon" src="./icon.png" alt="" draggable="false" />
        </span>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
